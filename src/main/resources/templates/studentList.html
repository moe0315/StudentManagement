<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生一覧</title>
</head>
<body>
<h1>受講生一覧</h1>
<table border="1">
  <thead>
  <tr>
    　
    <th>ID</th>　
    <th>名前</th>　
    <th>カナ名</th>　
    <th>ニックネーム</th>　
    <th>メールアドレス</th>　
    <th>地域</th>　
    <th>年齢</th>　
    <th>性別</th>　
    <th>備考</th>
    <th>コース名</th>
    <th>受講開始日</th>
    <th>受講終了予定日</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="studentDetail : ${studentList}">
    <td th:text="${studentDetail.student.id}">s001</td>
    <td th:text="${studentDetail.student.name}">SatohMoe</td>
    <td th:text="${studentDetail.student.kanaName}">サトウモエ</td>
    <td th:text="${studentDetail.student.nickname}">もーりー</td>
    <td th:text="${studentDetail.student.emailAddress}">moe.satoh@example.com</td>
    <td th:text="${studentDetail.student.city}">宮城県仙台市</td>
    <td th:text="${studentDetail.student.age}">25</td>
    <td th:text="${studentDetail.student.gender}">女性</td>
    <td th:text="${studentDetail.student.remark}">特になし</td>
    <!-- コース情報（1件目のコースを表示する） -->
    <td th:text="${studentDetail.studentsCourses != null && !studentDetail.studentsCourses.isEmpty() ? studentDetail.studentsCourses[0].coursesName : ''}">Javaスタンダード</td>
    <td th:text="${studentDetail.studentsCourses != null && !studentDetail.studentsCourses.isEmpty() ? studentDetail.studentsCourses[0].startDate : ''}">2026/04/01</td>
    <td th:text="${studentDetail.studentsCourses != null && !studentDetail.studentsCourses.isEmpty() ? studentDetail.studentsCourses[0].endDate : ''}">2026/09/30</td>
  </tr>
  </tbody>
</table>
</body>
</html>
